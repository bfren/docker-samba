services:
  samba:
    image: bfren/samba:3
    container_name: samba
    restart: unless-stopped
    ports:
      - "0.0.0.0:445:445"
    environment:
      - BF_SAMBA_UID=1000
    volumes:
      - ./v/shares.json:/files/shares.json:ro
      - ./v/example:/files/example
      - ./v/another:/files/another
    networks:
      - samba

networks:
  samba:
    driver: bridge
    name: samba
